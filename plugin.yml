name: Jupiter Integration
description: Builds a component inside a snapshot of the Jupiter multi-repo
author: https://github.com/jupitercloud
requirements:
  - bash
  - /run/current-system/profile/bin/btrfs
  - sudo
  - git
  - guile
  - realpath
configuration:
  properties:
    snapshot-path:
      type: string
      minLength: 1
      description: Absolute path to the published Jupiter Btrfs subvolume; falls back to BUILDKITE_JUPITER_SNAPSHOT_PATH
    root-repo:
      type: boolean
      default: false
      description: Integrate the checkout into the Jupiter snapshot root instead of a matching submodule
  additionalProperties: false
